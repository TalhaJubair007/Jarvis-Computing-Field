name: Jarvis Zygisk Build
run-name: Jarvis Zygisk · ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id: { description: Request correlation ID, required: true, type: string }
      repo_url: { description: Public HTTPS module repository, required: true, type: string }
      branch: { description: Source branch or tag, required: true, type: string }
      workspace_name: { description: Workspace label, required: true, type: string }
      abis: { description: Comma-separated Android ABIs, required: true, default: arm64-v8a, type: string }
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Free disk and validate inputs
        env:
          REPO_URL: ${{ inputs.repo_url }}
          SOURCE_BRANCH: ${{ inputs.branch }}
          ABIS: ${{ inputs.abis }}
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android/sdk /usr/share/dotnet /opt/ghc /usr/local/share/powershell /usr/local/share/chromium || true
          python3 - <<'PY'
          import os,re
          from urllib.parse import urlparse
          u=urlparse(os.environ['REPO_URL'])
          if u.scheme!='https' or u.hostname not in {'github.com','gitlab.com','android.googlesource.com'} or u.username or u.password or u.query or u.fragment: raise SystemExit('Invalid public HTTPS repository')
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._/-]{0,119}',os.environ['SOURCE_BRANCH']) or '..' in os.environ['SOURCE_BRANCH']: raise SystemExit('Invalid branch')
          allowed={'arm64-v8a','armeabi-v7a','x86','x86_64'}
          if not set(os.environ['ABIS'].split(',')) <= allowed: raise SystemExit('Unsupported ABI')
          PY
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip zip cmake ninja-build
          df -h /
      - name: Install pinned Android NDK r30
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://dl.google.com/android/repository/android-ndk-r30-linux.zip -o "$RUNNER_TEMP/ndk.zip"
          echo '5107f898313790e449e87eee2183d9a20602dee9  '"$RUNNER_TEMP/ndk.zip" | sha1sum -c -
          mkdir -p "$RUNNER_TEMP/ndk"
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP/ndk"
          echo "ANDROID_NDK_HOME=$RUNNER_TEMP/ndk/android-ndk-r30" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/ndk.zip"
          df -h /
      - name: Clone module source
        env:
          REPO_URL: ${{ inputs.repo_url }}
          SOURCE_BRANCH: ${{ inputs.branch }}
          WORKSPACE_NAME: ${{ inputs.workspace_name }}
        run: |
          set -euo pipefail
          git clone --depth=1 --recurse-submodules --shallow-submodules --single-branch --branch "$SOURCE_BRANCH" "$REPO_URL" "$RUNNER_TEMP/$WORKSPACE_NAME"
          echo "MODULE_SOURCE=$RUNNER_TEMP/$WORKSPACE_NAME" >> "$GITHUB_ENV"
      - name: Compile selected Android ABIs
        env:
          ABIS: ${{ inputs.abis }}
        run: |
          set -euo pipefail
          SRC="$MODULE_SOURCE"
          mkdir -p "$RUNNER_TEMP/jarvis-result/module"
          if [[ ! -f "$SRC/module.prop" ]]; then echo 'Repository must include module.prop at its root.'; exit 2; fi
          cp -a "$SRC/module.prop" "$RUNNER_TEMP/jarvis-result/module/"
          if [[ -f "$SRC/Android.mk" || -f "$SRC/jni/Android.mk" ]]; then
            cd "$SRC"
            "$ANDROID_NDK_HOME/ndk-build" APP_ABI="$ABIS" -j2
            find "$SRC" -type f -name '*.so' -print0 | while IFS= read -r -d '' f; do
              abi="$(basename "$(dirname "$f")")"
              mkdir -p "$RUNNER_TEMP/jarvis-result/module/zygisk"
              cp -a "$f" "$RUNNER_TEMP/jarvis-result/module/zygisk/$abi.so"
            done
          elif [[ -f "$SRC/CMakeLists.txt" ]]; then
            IFS=',' read -ra ABI_LIST <<< "$ABIS"
            for abi in "${ABI_LIST[@]}"; do
              build="$RUNNER_TEMP/cmake-$abi"
              cmake -S "$SRC" -B "$build" \
                -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI="$abi" -DANDROID_PLATFORM=android-23 -DCMAKE_BUILD_TYPE=Release
              cmake --build "$build" --parallel 2
              find "$build" -type f -name '*.so' -print0 | while IFS= read -r -d '' f; do
                mkdir -p "$RUNNER_TEMP/jarvis-result/module/zygisk"
                cp -a "$f" "$RUNNER_TEMP/jarvis-result/module/zygisk/$abi.so"
              done
            done
          else
            echo 'Source must contain Android.mk/jni/Android.mk or CMakeLists.txt.'; exit 2
          fi
          if ! find "$RUNNER_TEMP/jarvis-result/module/zygisk" -type f -name '*.so' 2>/dev/null | grep -q .; then echo 'No native .so output found.'; exit 3; fi
          cd "$RUNNER_TEMP/jarvis-result"
          zip -qr zygisk-output.zip module
          sha256sum zygisk-output.zip > zygisk-output.zip.sha256
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-build-output
          path: ${{ runner.temp }}/jarvis-result/
          if-no-files-found: warn
          retention-days: 1
