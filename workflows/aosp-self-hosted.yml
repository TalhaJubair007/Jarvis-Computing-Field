name: Jarvis AOSP Self-Hosted Build
run-name: Jarvis AOSP · ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id: { description: Request correlation ID, required: true, type: string }
      manifest_url: { description: Public manifest repository HTTPS URL, required: true, type: string }
      branch: { description: ROM / Android branch, required: true, type: string }
      lunch_target: { description: Exact device lunch target, required: true, type: string }
      workspace_name: { description: Workspace label, required: true, type: string }
      build_goal: { description: Build goal, required: true, default: all, type: string }
permissions:
  contents: read
jobs:
  build:
    # This workflow will queue until a trusted Linux x86-64 runner labelled aosp64 is online.
    runs-on: [self-hosted, linux, x64, aosp64]
    timeout-minutes: 360
    steps:
      - name: Verify dedicated AOSP host
        env:
          MANIFEST_URL: ${{ inputs.manifest_url }}
          SOURCE_BRANCH: ${{ inputs.branch }}
          LUNCH_TARGET: ${{ inputs.lunch_target }}
          WORKSPACE_NAME: ${{ inputs.workspace_name }}
          BUILD_GOAL: ${{ inputs.build_goal }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re,shutil
          from urllib.parse import urlparse
          u=urlparse(os.environ['MANIFEST_URL'])
          if u.scheme!='https' or u.hostname not in {'github.com','gitlab.com','android.googlesource.com'} or u.username or u.password or u.query or u.fragment: raise SystemExit('Invalid public manifest URL')
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._/-]{0,119}',os.environ['SOURCE_BRANCH']) or '..' in os.environ['SOURCE_BRANCH']: raise SystemExit('Invalid branch')
          for key in ('LUNCH_TARGET','BUILD_GOAL'):
            if not re.fullmatch(r'[A-Za-z0-9_.+-]{1,120}',os.environ[key]): raise SystemExit('Invalid '+key)
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9_.-]{1,59}',os.environ['WORKSPACE_NAME']): raise SystemExit('Invalid workspace name')
          ram=int(open('/proc/meminfo').read().split('MemTotal:')[1].split()[0])//1048576
          free=shutil.disk_usage('/srv' if os.path.isdir('/srv') else os.getcwd()).free//(1024**3)
          if ram<64: raise SystemExit(f'AOSP requires at least 64 GiB RAM; detected {ram} GiB')
          if free<400: raise SystemExit(f'AOSP requires at least 400 GiB free disk; detected {free} GiB')
          if not shutil.which('repo') or not shutil.which('git'): raise SystemExit('Install Google repo launcher and git on the self-hosted runner')
          PY
      - name: Sync source
        env:
          MANIFEST_URL: ${{ inputs.manifest_url }}
          SOURCE_BRANCH: ${{ inputs.branch }}
          WORKSPACE_NAME: ${{ inputs.workspace_name }}
        run: |
          set -euo pipefail
          ROOT="/srv/jarvis-aosp/${WORKSPACE_NAME}"
          mkdir -p "$ROOT"
          if [[ -n "$(find "$ROOT" -mindepth 1 -maxdepth 1 -print -quit)" ]]; then echo 'Workspace is not empty; refusing to overwrite.'; exit 3; fi
          cd "$ROOT"
          repo init --partial-clone -u "$MANIFEST_URL" -b "$SOURCE_BRANCH"
          repo sync -c --no-tags -j4
          echo "AOSP_ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Build ROM goal
        env:
          LUNCH_TARGET: ${{ inputs.lunch_target }}
          BUILD_GOAL: ${{ inputs.build_goal }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jarvis-result"
          exec > >(tee "$RUNNER_TEMP/jarvis-result/build.log") 2>&1
          cd "$AOSP_ROOT"
          source build/envsetup.sh
          lunch "$LUNCH_TARGET"
          if [[ "$BUILD_GOAL" == 'all' ]]; then m -j8; else m "$BUILD_GOAL" -j8; fi
          mkdir -p "$RUNNER_TEMP/jarvis-result/output"
          find out/target/product -type f \( -name '*.zip' -o -name '*.img' -o -name '*.bin' -o -name '*.tar' \) -size -1800M -print0 | while IFS= read -r -d '' f; do cp -a --parents "$f" "$RUNNER_TEMP/jarvis-result/output/"; done
          cd "$RUNNER_TEMP/jarvis-result"
          zip -qr aosp-output.zip output
          sha256sum aosp-output.zip > aosp-output.zip.sha256
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-build-output
          path: ${{ runner.temp }}/jarvis-result/
          if-no-files-found: warn
          retention-days: 1
