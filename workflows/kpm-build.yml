name: Jarvis APatch KPM Build
run-name: Jarvis KPM · ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id: { description: Request correlation ID, required: true, type: string }
      repo_url: { description: Public HTTPS KernelPatch/KPM repository, required: true, type: string }
      branch: { description: Source branch or tag, required: true, type: string }
      workspace_name: { description: Workspace label, required: true, type: string }
      project_subdir: { description: KPM project directory, required: true, default: kpms, type: string }
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Free disk and validate inputs
        env:
          REPO_URL: ${{ inputs.repo_url }}
          SOURCE_BRANCH: ${{ inputs.branch }}
          PROJECT_SUBDIR: ${{ inputs.project_subdir }}
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android/sdk /usr/share/dotnet /opt/ghc /usr/local/share/powershell /usr/local/share/chromium || true
          python3 - <<'PY'
          import os,re
          from urllib.parse import urlparse
          u=urlparse(os.environ['REPO_URL'])
          if u.scheme!='https' or u.hostname not in {'github.com','gitlab.com'} or u.username or u.password or u.query or u.fragment: raise SystemExit('Use a public HTTPS GitHub or GitLab repo')
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._/-]{0,119}',os.environ['SOURCE_BRANCH']) or '..' in os.environ['SOURCE_BRANCH']: raise SystemExit('Invalid branch')
          p=os.environ['PROJECT_SUBDIR']
          if not re.fullmatch(r'[A-Za-z0-9_.\/-]{1,120}',p) or '..' in p.split('/'): raise SystemExit('Invalid project subdirectory')
          PY
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends make curl tar gzip zip
          df -h /
      - name: Install checksum-verified AArch64 bare-metal GCC
        run: |
          set -euo pipefail
          base='https://sourceforge.net/projects/aarch64-none-elf-gcc-xpack/files/v15.2.1-1.1'
          archive='xpack-aarch64-none-elf-gcc-15.2.1-1.1-linux-x64.tar.gz'
          sidecar="$archive.sha"
          curl -fL --retry 3 "$base/$sidecar/download" -o "$RUNNER_TEMP/$sidecar"
          echo 'b3f2da34981f293ae3d683f3b616f05c77d5453fd4b4c195f4c9e8e640971dec  '"$RUNNER_TEMP/$sidecar" | sha256sum -c -
          expected="$(grep -Eo '[a-fA-F0-9]{64}' "$RUNNER_TEMP/$sidecar" | head -1)"
          [[ "$expected" =~ ^[a-fA-F0-9]{64}$ ]]
          curl -fL --retry 3 "$base/$archive/download" -o "$RUNNER_TEMP/$archive"
          echo "$expected  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/kpm-toolchain"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/kpm-toolchain"
          compiler="$(find "$RUNNER_TEMP/kpm-toolchain" -type f -name aarch64-none-elf-gcc -perm -u+x -print -quit)"
          [[ -n "$compiler" ]]
          echo "KPM_BIN_DIR=$(dirname "$compiler")" >> "$GITHUB_ENV"
      - name: Clone KPM project
        env:
          REPO_URL: ${{ inputs.repo_url }}
          SOURCE_BRANCH: ${{ inputs.branch }}
          WORKSPACE_NAME: ${{ inputs.workspace_name }}
        run: |
          set -euo pipefail
          git clone --depth=1 --recurse-submodules --shallow-submodules --single-branch --branch "$SOURCE_BRANCH" "$REPO_URL" "$RUNNER_TEMP/$WORKSPACE_NAME"
          echo "KPM_SOURCE=$RUNNER_TEMP/$WORKSPACE_NAME" >> "$GITHUB_ENV"
      - name: Compile KPM
        env:
          PROJECT_SUBDIR: ${{ inputs.project_subdir }}
        run: |
          set -euo pipefail
          SRC="$KPM_SOURCE"
          PROJECT="$SRC/$PROJECT_SUBDIR"
          [[ -f "$SRC/Makefile" || -d "$SRC/kpms" ]] || { echo 'Repository does not look like a KernelPatch tree.'; exit 2; }
          [[ -d "$PROJECT" && -f "$PROJECT/Makefile" ]] || { echo "KPM directory $PROJECT_SUBDIR/Makefile not found."; exit 2; }
          mkdir -p "$RUNNER_TEMP/jarvis-result"
          export PATH="$KPM_BIN_DIR:$PATH"
          export TARGET_COMPILE=aarch64-none-elf- KP_DIR="$SRC"
          make -C "$PROJECT" clean
          make -C "$PROJECT" -j2
          find "$SRC" -type f -name '*.kpm' -print -exec cp -a '{}' "$RUNNER_TEMP/jarvis-result/" \;
          if ! find "$RUNNER_TEMP/jarvis-result" -type f -name '*.kpm' | grep -q .; then echo 'Build completed without a .kpm artifact.'; exit 3; fi
          cd "$RUNNER_TEMP/jarvis-result"
          zip -q kpm-output.zip ./*.kpm
          sha256sum kpm-output.zip > kpm-output.zip.sha256
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-build-output
          path: ${{ runner.temp }}/jarvis-result/
          if-no-files-found: warn
          retention-days: 1
