name: Jarvis Telegram Build Notifications
on:
  workflow_run:
    workflows:
      - Jarvis Kernel Build
      - Jarvis Zygisk Build
      - Jarvis APatch KPM Build
      - Jarvis AOSP Self-Hosted Build
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  notify:
    # This privileged workflow only handles manually dispatched builds from this repository.
    if: github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout notification helper from the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Download output from the completed build
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: jarvis-build-output
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: payload
      - name: Send status and files to the owner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          BUILD_NAME: ${{ github.event.workflow_run.name }}
          BUILD_STATUS: ${{ github.event.workflow_run.status }}
          BUILD_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          BUILD_URL: ${{ github.event.workflow_run.html_url }}
          PAYLOAD_DIR: payload
        run: python3 scripts/notify_telegram.py
